name: Noctis
options:
  createIntermediateGroups: true
  deploymentTarget:
    # iOS 26.1: the evening bedtime accessory (tabViewBottomAccessory(isEnabled:)) and AlarmKit's one-button alert need it, and a lower
    # floor would ship those two features degraded (QA_LEDGER.md). The Watch has nothing above 26.0.
    iOS: "26.1"
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # QA part 1 (QA_LEDGER.md): complete strict concurrency checking everywhere, including the UI tests (Swift 5 language mode).
    SWIFT_STRICT_CONCURRENCY: complete
    # iPhone only: no iPad layout, no Mac Catalyst, and neither the Mac nor the Apple Vision "Designed for iPhone & iPad" destination.
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  NoctisKit:
    path: Packages/NoctisKit

# In the navigator for the scheme's StoreKit testing, but never bundled
# into the app.
fileGroups:
  - Config/Noctis.storekit

# The unit suite under the time zone, region, clock and first-weekday configurations in Config/NOCTIS.xctestplan (QA part 2, 2.9):
#   xcodebuild test -scheme NOCTIS-Unit -testPlan NOCTIS -destination 'platform=iOS Simulator,id=...'
schemes:
  # The purchase tests (Tests/StoreTests/), hosted by the app.
  NOCTIS-Store:
    build:
      targets:
        Noctis: [test]
        NoctisStoreTests: [test]
    test:
      targets:
        - NoctisStoreTests
  NOCTIS-Unit:
    build:
      targets:
        Noctis: [test]
    test:
      testPlans:
        - path: Config/NOCTIS.xctestplan
          defaultPlan: true

targets:
  Noctis:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: App
    dependencies:
      - package: NoctisKit
        product: AppRoot
      # The App Shortcuts provider names the intents' package (APP_RULES.md R47).
      - package: NoctisKit
        product: NoctisIntentKit
      # The alarm's snooze countdown is drawn by this extension (see APP_RULES.md R30).
      - target: NoctisAlarmWidget
      # The Home Screen and Lock Screen widgets (APP_RULES.md R44): they read one file the app writes into the App Group.
      - target: NoctisWidgets
      # The Apple Watch app (APP_RULES.md R50): embedded here, installed from the Watch app on the iPhone.
      - target: NOCTISWatch
    # HealthKit, read-only (see NSHealthShareUsageDescription below). The App Group is the one place the app shares
    # a file with its widgets (APP_RULES.md R44): a small summary the app writes and the widgets read.
    entitlements:
      path: Config/Noctis.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Sign in with Apple, optional and local (APP_RULES.md R69): the iOS app only.
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit.access: []
        # Apple Health wakes the app when new sleep data arrives, so the widgets are true in the morning (APP_RULES.md R46). Best-effort.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.noctis.app
    scheme:
      testTargets:
        - NoctisUITests
      storeKitConfiguration: Config/Noctis.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app
        PRODUCT_NAME: NOCTIS
        # iPhone only. The project-level value is not enough: xcodegen's iOS application preset sets "1,2" on the target itself and that
        # wins (the first QA build was Universal, and the Release device build warned that an iPad app must support every orientation).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: NOCTIS
        # Export compliance (QA-016): NOCTIS has no encryption of its own, only the operating system's (exempt); no CryptoKit, CommonCrypto or Security symbol is
        # linked and the app makes no request of its own (scripts/qa_symbol_audit.sh), so App Store Connect need not ask for every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # NSAlarmKitUsageDescription (AlarmKit refuses to schedule without it) has no build setting:
        # it is in App/Info.plist, which Xcode merges with the plist it generates.
        INFOPLIST_FILE: App/Info.plist
        # The snooze countdown is a Live Activity the system starts for the alarm.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "NOCTIS reads your sleep, heart rate, resting heart rate, heart rate variability and respiratory rate from Apple Health to build your sleep plan, show your recovery trends and keep your widgets up to date. It never writes to Health."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        DEVELOPMENT_ASSET_PATHS: "\"App/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES

  # The alarm's own screen for the one state AlarmKit leaves to the app: the countdown after
  # Snooze. It starts nothing, reads no data and has no network access.
  NoctisAlarmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Widgets/Alarm
    dependencies:
      - package: NoctisKit
        product: AlarmShared
    info:
      path: Widgets/Alarm/Info.plist
      properties:
        CFBundleDisplayName: NOCTIS Alarm
        # An extension must carry its app's version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.alarm
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  # NOCTIS's widgets: one Home Screen widget (small, medium, large) and one Lock Screen widget. The extension reads ONLY the
  # WidgetSnapshot file in the App Group (R44): it links NoctisWidgetKit, which depends on the design tokens and nothing that
  # reads Health, SwiftData or Coach. No network, no HealthKit entitlement. Its own privacy manifest declares no
  # required-reason API because it uses none.
  NoctisWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Widgets/Home
    dependencies:
      - package: NoctisKit
        product: NoctisWidgetKit
      # The intents the two controls run (R48): they name the snapshot, the sound names and nothing that plays, reads Health or stores.
      - package: NoctisKit
        product: NoctisIntentKit
    entitlements:
      path: Config/NoctisWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.noctis.app
    info:
      path: Widgets/Home/Info.plist
      properties:
        CFBundleDisplayName: NOCTIS Widgets
        # An extension must carry its app's version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.widgets
        PRODUCT_NAME: NOCTISWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  # The Apple Watch app (APP_RULES.md R50, R51, R52): a companion of NOCTIS that shows the summary the iPhone sends. It reads NO HealthKit and runs NO
  # engines: no HealthKit entitlement, no usage string, and it links the design tokens, the widget kit (the snapshot and its rules) and the Watch kit.
  # Its own copy of the summary lives in its App Group, shared with its complications.
  NOCTISWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/App
    dependencies:
      - package: NoctisKit
        product: NoctisWatchKit
      - package: NoctisKit
        product: NoctisWidgetKit
      - package: NoctisKit
        product: DesignSystem
      - package: NoctisKit
        product: BreathingKit
      # The complications (part 2 of the Watch work).
      - target: NOCTISWatchWidgets
    entitlements:
      path: Config/NOCTISWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.noctis.app
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: NOCTIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.noctis.app
        # Breathing keeps the app running with the wrist down (a mindfulness extended runtime session, R55).
        WKBackgroundModes:
          - mindfulness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.watchkitapp
        PRODUCT_NAME: NOCTISWatch
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES  # embedded in the iPhone app; installed on its own it makes the archive two apps and Organizer offers no "Distribute App"
        TARGETED_DEVICE_FAMILY: "4"

  # The Watch's complications (built in part 2): they will read the Watch's copy of the summary and draw it. The target is empty for now.
  NOCTISWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch/Widgets
    dependencies:
      - package: NoctisKit
        product: NoctisWatchKit
      - package: NoctisKit
        product: NoctisWidgetKit
    entitlements:
      path: Config/NOCTISWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.noctis.app
    info:
      path: Watch/Widgets/Info.plist
      properties:
        CFBundleDisplayName: NOCTIS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.watchkitapp.widgets
        PRODUCT_NAME: NOCTISWatchWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  # QA part 3, step 4: unit tests that need an app identity, hosted by Noctis. SKTestSession drives StoreKit's test server for the app's real Noctis.storekit;
  # a SwiftPM (hostless) test process gets no products and StoreKitError.notEntitled. Run: xcodebuild test -scheme NOCTIS-Store -destination ...
  NoctisStoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Tests/StoreTests
    dependencies:
      - target: Noctis
      - package: NoctisKit
        product: NoctisCore
      - package: NoctisKit
        product: PremiumKit
      - package: NoctisKit
        product: NoctisWatchKit
      - package: NoctisKit
        product: NoctisIntentKit
      - package: NoctisKit
        product: NightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.storetests
        # The host is NOCTIS.app (PRODUCT_NAME), not the target's name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOCTIS.app/NOCTIS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        LM_SKIP_METADATA_EXTRACTION: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-deprecated-declarations"

  NoctisUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Noctis
      # The list of every screen and the Debug flags that reach it (R67): the matrix tests read it, the app never links it.
      - package: NoctisKit
        product: QACatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # A UI test bundle has no App Intents, and the extractor says so as a warning on every build ("no AppIntents.framework dependency
        # found"). LM_FILTER_WARNINGS does not quiet it; LM_SKIP_METADATA_EXTRACTION (in Xcode's build service, not in its spec files) does.
        # The app's own extraction is untouched.
        LM_SKIP_METADATA_EXTRACTION: YES
        # StoreKitTest's own header (SKTestTransaction.h) uses SKPaymentTransactionState, which StoreKit deprecated in iOS 18: a warning in the SDK's
        # header, raised in every file that imports the module (the QA matrix starts a test session for the paywall's plans). Suppressed here only.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-deprecated-declarations"
