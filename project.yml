name: Noctis
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

packages:
  NoctisKit:
    path: Packages/NoctisKit

# In the navigator for the scheme's StoreKit testing, but never bundled
# into the app.
fileGroups:
  - Noctis.storekit

targets:
  Noctis:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    dependencies:
      - package: NoctisKit
        product: AppRoot
      # The App Shortcuts provider names the intents' package (APP_RULES.md R47).
      - package: NoctisKit
        product: NoctisIntentKit
      # The alarm's snooze countdown is drawn by this extension (see APP_RULES.md R30).
      - target: NoctisAlarmWidget
      # The Home Screen and Lock Screen widgets (APP_RULES.md R44): they read one file the app writes into the App Group.
      - target: NoctisWidgets
    # HealthKit, read-only (see NSHealthShareUsageDescription below). The App Group is the one place the app shares
    # a file with its widgets (APP_RULES.md R44): a small summary the app writes and the widgets read.
    entitlements:
      path: App/Noctis.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Apple Health wakes the app when new sleep data arrives, so the widgets are true in the morning (APP_RULES.md R46). Best-effort.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.noctis.app
    scheme:
      testTargets:
        - NoctisUITests
      storeKitConfiguration: Noctis.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app
        PRODUCT_NAME: NOCTIS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: NOCTIS
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # NSAlarmKitUsageDescription (AlarmKit refuses to schedule without it) has no build setting:
        # it is in App/Info.plist, which Xcode merges with the plist it generates.
        INFOPLIST_FILE: App/Info.plist
        # The snooze countdown is a Live Activity the system starts for the alarm.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "NOCTIS reads your sleep, heart rate, resting heart rate, heart rate variability and respiratory rate from Apple Health to build your sleep plan, show your recovery trends and keep your widgets up to date. It never writes to Health."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        DEVELOPMENT_ASSET_PATHS: "\"App/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES

  # The alarm's own screen for the one state AlarmKit leaves to the app: the countdown after
  # Snooze. It starts nothing, reads no data and has no network access.
  NoctisAlarmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NoctisAlarmWidget
    dependencies:
      - package: NoctisKit
        product: AlarmShared
    info:
      path: NoctisAlarmWidget/Info.plist
      properties:
        CFBundleDisplayName: NOCTIS Alarm
        # An extension must carry its app's version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.alarm
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  # NOCTIS's widgets: one Home Screen widget (small, medium, large) and one Lock Screen widget. The extension reads ONLY the
  # WidgetSnapshot file in the App Group (R44): it links NoctisWidgetKit, which depends on the design tokens and nothing that
  # reads Health, SwiftData or Coach. No network, no HealthKit entitlement. Its own privacy manifest declares no
  # required-reason API because it uses none.
  NoctisWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NoctisWidgets
    dependencies:
      - package: NoctisKit
        product: NoctisWidgetKit
      # The intents the two controls run (R48): they name the snapshot, the sound names and nothing that plays, reads Health or stores.
      - package: NoctisKit
        product: NoctisIntentKit
    entitlements:
      path: NoctisWidgets/NoctisWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.noctis.app
    info:
      path: NoctisWidgets/Info.plist
      properties:
        CFBundleDisplayName: NOCTIS Widgets
        # An extension must carry its app's version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.widgets
        PRODUCT_NAME: NOCTISWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  NoctisUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: Noctis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctis.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
